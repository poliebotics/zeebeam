[package]
name = "zeebeam-chain-script"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "zeebeam-chain"
autobins = false

[features]
default = []
groth16 = ["sp1-sdk/native-gnark"]
cuda = ["sp1-sdk/cuda"]

[workspace]

[[bin]]
name = "zeebeam-chain"
path = "src/main.rs"

[dependencies]
bincode = "=1.3.3"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.4.0", features = ["blocking", "profiling"] }
serde_json = "1"

[build-dependencies]
sp1-build = "=6.4.0"

[patch.crates-io]
jubjub = { path = "/home/c/Documents/BOSUN/scratch/joined_build_20260901/vendor/jubjub-0.10.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.2.0" }
