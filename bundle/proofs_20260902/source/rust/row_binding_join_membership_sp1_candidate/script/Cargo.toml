[package]
name = "zeebeam-row-binding-membership-script"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "zeebeam-row-binding-membership-execute"
autobins = false

[features]
default = []
groth16 = ["sp1-sdk/native-gnark"]
cuda = ["sp1-sdk/cuda"]

[workspace]

[[bin]]
name = "zeebeam-row-binding-membership-ceremony"
path = "src/ceremony.rs"

[[bin]]
name = "zeebeam-row-binding-membership-execute"
path = "src/main.rs"

[[bin]]
name = "zeebeam-row-binding-membership-core"
path = "src/core.rs"

[[bin]]
name = "zeebeam-row-binding-membership-groth16"
path = "src/groth16.rs"
required-features = ["groth16"]

[dependencies]
bincode = "=1.3.3"
libc = "=0.2.189"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.4.0", features = ["blocking", "profiling"] }
serde_json = "1"
zeebeam-row-binding-join = { path = "../../row_binding_join_sp1_candidate/join" }
zeebeam-row-binding-membership = { path = "../membership" }
zeebeam-row-binding-membership-native = { path = "../native" }

[build-dependencies]
sp1-build = { version = "=6.4.0" }

[patch.crates-io]
jubjub = { path = "/home/c/Documents/BOSUN/scratch/joined_build_20260901/vendor/jubjub-0.10.0" }  # sp1-fork compat: consts made non-const, RedJubjub is never exercised
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.2.0" }
